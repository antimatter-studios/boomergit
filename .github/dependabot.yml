version: 2
updates:
  # The workflows pin every action to a full commit SHA (with the version as a
  # trailing comment). Dependabot keeps those pins current by opening a PR
  # that moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
